<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香橙村數線尋寶 - 主選單</title>
    <link rel="stylesheet" href="./menu_style_2.css" />
  <link rel="stylesheet" href="./prep_style.css" />
  <!-- Preload the helper bear image used in the final zoom animation -->
  <link rel="preload" href="./bear_trans_blue.png" as="image" />
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <div id="viewport-container">
    <canvas id="gameCanvas"></canvas>

    <header class="ui-top-header" aria-label="Top controls">
      <a class="ui-home-button" href="../temp_index.html" aria-label="Go to home screen" title="返回主頁">
        <svg class="ui-home-icon" viewBox="0 0 100 100" role="img" aria-hidden="true" focusable="false">
          <polygon points="25,2 75,2 98,25 98,75 75,98 25,98 2,75 2,25" fill="#ff8c1a" stroke="#8a4b00" stroke-width="6"></polygon>
          <polygon points="18,18 82,18 82,82 18,82" fill="#ffb347" opacity="0.45"></polygon>
          <path d="M50 27 70 45v25H57V56H43v14H30V45z" fill="#5a2f00"></path>
        </svg>
      </a>
    </header>

        <img
      id="helperBearSprite"
      class="bear-sprite"
      src="./bear_back.png"
      alt="水果熊助手"
    />


    <div id="dialogSpeechBubble" class="dialog-speech-bubble"></div>

    <img
      id="walkingBearSprite"
      class="bear-walking-sprite"
      src="./bear_side.png"
      alt="水果熊行走"
    />

    <div id="menu" class="menu-container" style="display:none;">

      <div class="menu-arrow strawberry-box">

        
      </div>
    </div>
    
    <div id="menuShell" class="game-shell max-w-3xl mx-auto flex flex-col items-center justify-center min-h-screen">
      <h1 id="gameTitle" class="mb-8 px-6 py-5">
        <img
          src="./orange_game_title.png"
          alt="🍊香橙島任務1：數線尋寶"
          class="mx-auto"
          style="
            height:50vh;width:auto;
          "
        />
      </h1>


      <div id="menu2Overlay" class="menu2-overlay hidden" aria-hidden="true">
        <main class="menu2-shell" aria-label="Game setup menu">
          <section
            class="menu2-stage is-active"
            data-stage="tutorial-choice"
            aria-label="Choose tutorial"
          >
            <div class="menu2-button-stack">
              <button
                type="button"
                class="menu2-button"
                data-tutorial-choice="yes"
                disabled
                aria-disabled="true"
                title="暫時停用"
              >
                好
                <img src="./bear_head_tutorial_yes.png" alt="" aria-hidden="true" class="menu2-inline-bear-head" />
              </button>
              <button type="button" class="menu2-button" data-tutorial-choice="no">
                不用了，謝謝
                <img src="./bear_head_tutorial_no.png" alt="" aria-hidden="true" class="menu2-inline-bear-head" />
              </button>
            </div>
          </section>

          <section
            class="menu2-stage"
            data-stage="range-choice"
            aria-label="Choose range"
          >
            <div class="menu2-button-stack">
              <button type="button" class="menu2-button" data-range-choice="0-10">Level 1️⃣ <br>0 至 10</button>
              <button type="button" class="menu2-button" data-range-choice="11-20">Level 2️⃣ <br>11 至 20</button>
              <button type="button" class="menu2-button" data-range-choice="0-20">Level 3️⃣ <br>0 至 20</button>
            </div>
          </section>

          <div class="menu2-back-bar" aria-label="Menu navigation">
            <button
              type="button"
              class="menu2-back-button"
              id="menu2-back-button"
              aria-label="Go back"
              hidden
            >⬅</button>
          </div>
        </main>
      </div>

            <!-- 教學視窗覆蓋層 -->
      <div
        id="tutorialOverlay"
        class="fixed inset-0 bg-black/75 z-[1800] hidden"
      ></div>


      <!-- 教學視窗 -->
      <div
        id="tutorialWindow"
        class="fixed top-[5%] left-[5%] right-[5%] bottom-[5%] bg-[#fffff0] border-4 border-[#f65555] rounded-2xl shadow-xl px-6 py-4 hidden z-[1900] flex flex-col"
      >
        <!-- 關閉按鈕 -->
        <button
          id="tutorialCloseButton"
          type="button"
          class="tutorial-close-button pushable-button absolute top-3 right-4"
        >
          <span class="front">退出❌</span>
        </button>

        <!-- 教學內容主區 -->
        <div
          id="tutorialContent"
          class="flex-1 flex items-center justify-center text-center px-4 py-4 overflow-y-auto"
        ></div>

        <!-- 底部導航列 -->
        <div class="mt-4 flex items-center justify-center gap-4">
          <button
            id="tutorialPrevButton"
            type="button"
            class="tutorial-nav-button pushable-button"
          >
            <span class="front">⬅️上一頁</span>
          </button>

          <span
            id="tutorialPageIndicator"
            class="text-xl text-gray-700"
          >
            第 1/4 頁
          </span>

          <button
            id="tutorialNextButton"
            type="button"
            class="tutorial-nav-button pushable-button"
          >
            <span class="front">➡️下一頁</span>
          </button>

          <button
            id="tutorialFinishButton"
            type="button"
            class="tutorial-finish-button pushable-button hidden"
          >
            <span class="front">✅完成教程</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="./prep_script.js"></script>
  <script src="./menu_script_2.js"></script>
</body>
</html>
